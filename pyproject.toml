[project]
name = "browser-agent"
version = "0.0.1"
description = "A Managed Deep Agent that browses the web with per-user Playwright contexts and redacted traces."
requires-python = ">=3.11"
dependencies = [
    # Imported directly by tools/ (also pulled in transitively by managed-deepagents).
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langsmith>=0.14",
    "managed-deepagents==0.9.3",
    "playwright>=1.64.0",
    "python-dotenv>=1.2.4",
]

[tool.mda]
python-version = "3.14"
