<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Agent Architecture</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --fg: #1d1d1b; --muted: #6b6b66; --line: #cfcfc8;
    --accent: #1f6feb; --accent-bg: #e6f0ff; --warn: #b35900; --warn-bg: #fff1e0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111214; --panel: #1a1c1f; --fg: #ececea; --muted: #9a9a94; --line: #3a3d42;
      --accent: #6aa3ff; --accent-bg: #1b2a44; --warn: #ffb066; --warn-bg: #3a2a16;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111214; --panel: #1a1c1f; --fg: #ececea; --muted: #9a9a94; --line: #3a3d42;
    --accent: #6aa3ff; --accent-bg: #1b2a44; --warn: #ffb066; --warn-bg: #3a2a16;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; }
  figcaption { color: var(--muted); font-size: 13px; padding: 8px 4px 0; }
  svg { display: block; width: 100%; max-width: 100%; height: auto; color: var(--fg); }
  svg text { fill: currentColor; font: 12px system-ui, sans-serif; }
  svg .t { font-weight: 600; font-size: 13px; }
  svg .m { fill: var(--muted); font-size: 11px; }
  .node rect { fill: var(--panel); stroke: currentColor; stroke-width: 1.2; }
  .node { cursor: pointer; outline: none; }
  .node:hover rect, .node:focus-visible rect { stroke: var(--accent); stroke-width: 2; }
  .node.on rect { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2; }
  .zone { fill: none; stroke: var(--muted); stroke-dasharray: 5 4; }
  .edge { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .edge.dash { stroke-dasharray: 4 3; stroke: var(--muted); }
  .lbl { fill: var(--muted) !important; font-size: 11px; }
  .guard rect { fill: var(--warn-bg); stroke: var(--warn); }
  .guard text { fill: var(--warn); }
  .flow { stroke: var(--accent); stroke-width: 2; fill: none; stroke-dasharray: 6 6;
    animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h2 { font-size: 15px; margin: 0 0 6px; }
  .card p { margin: 0 0 8px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { margin: 2px 0; }
  code { font: 13px ui-monospace, Menlo, monospace; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .tabs button[aria-selected="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .cmd { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  .cmd dt { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .cmd dd { margin: 0; color: var(--muted); }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  button.theme { float: right; font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
</style>
</head>
<body>
<main>
  <button class="theme" id="theme" type="button">Toggle theme</button>
  <h1>browser-agent: the browser harness</h1>
  <p class="sub">A managed deep agent that browses for users. It has no custom tools: it drives headless Chromium by running one CLI inside a per-thread sandbox.</p>

  <figure>
    <svg viewBox="0 0 1000 330" role="img"
         aria-label="A request flows from the user to the agent, which calls the execute tool into a per-thread sandbox; inside, browser_cli.py attaches over CDP via Playwright to headless Chromium, which reaches websites through a deny-listed proxy.">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10z" fill="currentColor"/>
        </marker>
        <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10z" fill="var(--accent)"/>
        </marker>
      </defs>

      <!-- sandbox boundary -->
      <rect class="zone" x="250" y="30" width="560" height="250" rx="12"/>
      <text class="m" x="264" y="50">Managed sandbox · one per thread (thread:&lt;thread_id&gt;)</text>

      <!-- user -->
      <g class="node" id="n-user" data-k="user" tabindex="0" role="button" aria-label="User">
        <rect x="20" y="110" width="110" height="60" rx="8"/>
        <text class="t" x="75" y="136" text-anchor="middle">User</text>
        <text class="m" x="75" y="154" text-anchor="middle">thread + message</text>
      </g>
      <!-- agent -->
      <g class="node" id="n-agent" data-k="agent" tabindex="0" role="button" aria-label="Agent">
        <rect x="20" y="215" width="110" height="60" rx="8"/>
        <text class="t" x="75" y="241" text-anchor="middle">Deep agent</text>
        <text class="m" x="75" y="259" text-anchor="middle">LLM + prompt</text>
      </g>
      <!-- cli -->
      <g class="node" id="n-cli" data-k="cli" tabindex="0" role="button" aria-label="browser_cli.py">
        <rect x="280" y="100" width="170" height="80" rx="8"/>
        <text class="t" x="365" y="128" text-anchor="middle">browser_cli.py</text>
        <text class="m" x="365" y="146" text-anchor="middle">/agent_tools · one action</text>
        <text class="m" x="365" y="162" text-anchor="middle">per call, JSON out</text>
      </g>
      <!-- playwright -->
      <g class="node" id="n-pw" data-k="pw" tabindex="0" role="button" aria-label="Playwright">
        <rect x="490" y="115" width="100" height="50" rx="8"/>
        <text class="t" x="540" y="145" text-anchor="middle">Playwright</text>
      </g>
      <!-- chrome -->
      <g class="node" id="n-chrome" data-k="chrome" tabindex="0" role="button" aria-label="Chromium">
        <rect x="630" y="100" width="160" height="80" rx="8"/>
        <text class="t" x="710" y="128" text-anchor="middle">Headless Chromium</text>
        <text class="m" x="710" y="146" text-anchor="middle">CDP :9222, long-lived</text>
        <text class="m" x="710" y="162" text-anchor="middle">persistent profile</text>
      </g>
      <!-- setup -->
      <g class="node" id="n-setup" data-k="setup" tabindex="0" role="button" aria-label="setup.sh snapshot">
        <rect x="280" y="205" width="230" height="55" rx="8"/>
        <text class="t" x="395" y="230" text-anchor="middle">Snapshot (setup.sh)</text>
        <text class="m" x="395" y="247" text-anchor="middle">Playwright + Chromium + CLI</text>
      </g>
      <!-- web -->
      <g class="node" id="n-web" data-k="web" tabindex="0" role="button" aria-label="Websites">
        <rect x="870" y="100" width="110" height="80" rx="8"/>
        <text class="t" x="925" y="136" text-anchor="middle">Websites</text>
        <text class="m" x="925" y="154" text-anchor="middle">untrusted</text>
      </g>
      <!-- traces -->
      <g class="node" id="n-trace" data-k="trace" tabindex="0" role="button" aria-label="LangSmith traces">
        <rect x="150" y="290" width="200" height="34" rx="8"/>
        <text class="t" x="250" y="312" text-anchor="middle">LangSmith (redacted)</text>
      </g>

      <!-- edges -->
      <line class="edge" x1="75" y1="170" x2="75" y2="215" marker-end="url(#ar)"/>
      <text class="lbl" x="83" y="197">asks / replies</text>
      <path class="flow" d="M130 245 H215 V140 H278" marker-end="url(#arA)"/>
      <text class="lbl" x="140" y="236">execute</text>
      <line class="edge" x1="450" y1="140" x2="490" y2="140" marker-end="url(#ar)"/>
      <line class="edge" x1="590" y1="140" x2="630" y2="140" marker-end="url(#ar)"/>
      <text class="lbl" x="598" y="132">CDP</text>
      <line class="edge" x1="790" y1="140" x2="868" y2="140" marker-end="url(#ar)"/>
      <text class="lbl" x="800" y="132">HTTPS</text>
      <g class="guard">
        <rect x="805" y="190" width="150" height="30" rx="6"/>
        <text x="880" y="209" text-anchor="middle">deny list: private IPs</text>
      </g>
      <line class="edge dash" x1="880" y1="190" x2="860" y2="182"/>
      <line class="edge dash" x1="395" y1="205" x2="395" y2="182" marker-end="url(#ar)"/>
      <text class="lbl" x="403" y="196">cloned per thread</text>
      <path class="edge dash" d="M75 275 V307 H150" marker-end="url(#ar)"/>
      <text class="lbl" x="86" y="303">traces</text>
    </svg>
    <figcaption>The animated arrow is the agent's only way in: the built-in <code>execute</code> tool, run inside that thread's sandbox.</figcaption>
  </figure>

  <div class="grid">
    <section class="card" id="detail" aria-live="polite">
      <h2 id="d-title"></h2>
      <p id="d-body"></p>
      <ul id="d-list"></ul>
    </section>

    <section class="card">
      <h2>What the agent can do</h2>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" aria-selected="true" data-t="read">Read</button>
        <button role="tab" aria-selected="false" data-t="act">Interact</button>
        <button role="tab" aria-selected="false" data-t="login">Log in</button>
        <button role="tab" aria-selected="false" data-t="limits">Limits</button>
      </div>
      <div id="tabbody"></div>
    </section>
  </div>

</main>

<script>
(function () {
  var DATA = {
    user: ["User / caller", "Owns the thread. Sends a URL or a task and gets back a summary.",
      ["Each thread is isolated: browser state does not persist across threads.", "Supplies credentials in chat only if they want the agent to log in."]],
    agent: ["Deep agent", "agent.py defines it with define_deep_agent(name=\"browser-agent\") and no custom tools. instructions.md is the always-loaded system prompt, and skills/page-details is discovered automatically.",
      ["Acts only through the built-in execute tool (120s cap per call).", "page-details skill: read-only report of the current URL, login state, summary and available tabs/buttons.", "Treats page content as untrusted data, never as instructions.", "Refuses localhost, private and metadata addresses.", "Traces are redacted before upload to LangSmith."]],
    cli: ["browser_cli.py", "Lives at /agent_tools/browser_cli.py (source: sandbox/agent_tools/). Each call does one action and prints JSON, so the model never writes Playwright code.",
      ["Commands: goto [--text], page, snap, text, tabs, shot, click, type, press, restart, stop.", "Default action timeout 20s; output capped at 6000 chars.", "type output redacts the typed text so passwords do not echo back.", "Errors come back as JSON with an error field for retry."]],
    pw: ["Playwright", "Python Playwright attaches to the running Chromium with connect_over_cdp, performs the action and disconnects. Chromium keeps running.",
      ["Not a project dependency: installed in the sandbox by setup.sh.", "Browsers live in /opt/playwright-browsers, symlinked to Playwright's default cache path."]],
    chrome: ["Headless Chromium", "Launched once with a remote-debugging port and a persistent user-data dir, so tabs, cookies and login sessions survive between execute calls.",
      ["Restart with restart if it gets stuck.", "Profile dir is off-limits to the model: it never reads cookies or storage files."]],
    setup: ["Sandbox snapshot", "mda deploy / mda dev run sandbox/setup.sh once: install Playwright and Chromium, write the embedded browser_cli.py to /agent_tools, smoke-test the CLI. New threads clone the snapshot.",
      ["No thread-end hook: idle and delete-after-stop TTLs reclaim sandboxes.", "The server image has no browser, so this is the only place it can be installed."]],
    web: ["Websites", "Everything here is untrusted. The proxy denies loopback, private, link-local (cloud metadata) and CGNAT ranges.",
      ["The SDK documents the deny list for outbound HTTPS; verify plain HTTP before relying on it."]],
    trace: ["LangSmith traces", "tools/tracing.py installs a redacting client: sensitive keys (resume, password, token ...) are scrubbed and detected secrets are anonymized.",
      ["Credentials typed for a login still pass through model context; redaction is by key and pattern."]]
  };
  var TABS = {
    read: [["goto URL [--text]", "open a page; returns title + accessibility snapshot, plus body text with --text"], ["page", "URL, title, snapshot, text and open tabs in one call"], ["snap", "re-read the current page"], ["text", "visible body text, truncated"], ["tabs", "list open tabs"], ["page-details skill", "read-only report: URL, logged in?, summary, tabs and buttons available"], ["shot [PATH]", "screenshot to /agent_tools/shot.png"]],
    act: [["click SEL", "click, then return a fresh snapshot"], ["type SEL TEXT [--enter]", "fill a field, optionally submit"], ["press KEY", "send a key press"], ["restart / stop", "recover or shut down Chromium"]],
    login: [["when", "only if the user asks and supplies credentials in the thread"], ["how", "goto login page, snap, type username + password, click submit"], ["MFA", "asks the user for the code in chat; CAPTCHA is reported, not bypassed"], ["after", "session persists in the profile for the rest of the thread"], ["never", "repeat credentials in replies, files or screenshots"]],
    limits: [["scope", "visits only URLs the user named; no link-following unless asked"], ["network", "private and metadata addresses are blocked at the proxy"], ["state", "one sandbox per thread; nothing carries over"], ["honesty", "reports empty pages and bot checks instead of guessing"]]
  };

  function el(tag, text, cls) { var e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; }

  function show(key) {
    var d = DATA[key];
    document.getElementById("d-title").textContent = d[0];
    document.getElementById("d-body").textContent = d[1];
    var ul = document.getElementById("d-list"); ul.textContent = "";
    d[2].forEach(function (t) { ul.appendChild(el("li", t)); });
    document.querySelectorAll(".node").forEach(function (n) { n.classList.toggle("on", n.dataset.k === key); });
  }
  document.querySelectorAll(".node").forEach(function (n) {
    n.addEventListener("click", function () { show(n.dataset.k); });
    n.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show(n.dataset.k); } });
  });

  function tab(key) {
    var body = document.getElementById("tabbody"); body.textContent = "";
    var dl = el("dl", "", "cmd");
    TABS[key].forEach(function (r) { dl.appendChild(el("dt", r[0])); dl.appendChild(el("dd", r[1])); });
    body.appendChild(dl);
    document.querySelectorAll("#tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.t === key); });
  }
  document.querySelectorAll("#tabs button").forEach(function (b) { b.addEventListener("click", function () { tab(b.dataset.t); }); });

  document.getElementById("theme").addEventListener("click", function () {
    var r = document.documentElement;
    var dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  });

  show("agent"); tab("read");
})();
</script>
</body>
</html>
